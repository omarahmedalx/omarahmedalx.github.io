<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Recovery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    background:#f5f6f8;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:70px;
    background:#ffffff;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#ff5a00;
}

nav a{
    text-decoration:none;
    color:#444;
    margin-left:25px;
    transition:.2s;
}

nav a:hover{
    color:#ff5a00;
}

.wrapper{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    width:430px;
    background:#fff;
    border-radius:14px;
    padding:40px;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.card h1{
    font-size:28px;
    margin-bottom:10px;
}

.card p{
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

label{
    font-size:14px;
    font-weight:600;
    color:#444;
}

input{
    width:100%;
    margin-top:8px;
    margin-bottom:20px;
    padding:14px;
    border:1px solid #d6d6d6;
    border-radius:8px;
    font-size:15px;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#ff5a00;
    box-shadow:0 0 0 3px rgba(255,90,0,.15);
}

button{
    width:100%;
    border:none;
    background:#ff5a00;
    color:white;
    padding:15px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    background:#e24f00;
}

button:disabled{
    opacity:.7;
    cursor:wait;
}

.message{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:8px;
    background:#ecfff0;
    color:#1d7d36;
    border:1px solid #b8e3c1;
}

footer{
    text-align:center;
    padding:20px;
    color:#888;
    font-size:14px;
}

@media(max-width:600px){

header{
padding:20px;
}

.card{
width:100%;
padding:30px;
}

}
</style>

</head>
<body>

<header>

<div class="logo">
MySite
</div>

<nav>
<a href="#">Home</a>
<a href="#">Login</a>
<a href="#">Register</a>
</nav>

</header>

<div class="wrapper">

<div class="card">

<h1>Password Recovery</h1>

<p>
Enter your email address below and we'll send you instructions to reset your password.
</p>

<form id="recoverForm">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="name@example.com"
required>

<button id="submitBtn">
Send Recovery Link
</button>

<div class="message" id="message">
✅ Recovery email sent successfully.
</div>

</form>

</div>

</div>

<footer>
© 2026 MySite. All rights reserved.
</footer>

<script>

const form=document.getElementById("recoverForm");
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("message");

form.addEventListener("submit",function(e){

e.preventDefault();

btn.disabled=true;
btn.innerHTML="Sending...";

setTimeout(()=>{

btn.disabled=false;
btn.innerHTML="Send Recovery Link";

msg.style.display="block";

form.reset();

},1500);

});

</script>

</body>
</html>
